name: Alaud
options:
  bundleIdPrefix: com.gaoyiming.alaud
  deploymentTarget:
    iOS: '26.0'
    watchOS: '26.0'
    macOS: '26.0'
  createIntermediateGroups: true
packages:
  AlaudCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_LANGUAGE: zh-Hans
    GENERATE_INFOPLIST_FILE: NO
targets:
  Alaud:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/Phone
    info:
      path: Config/Phone-Info.plist
      properties:
        CFBundleDisplayName: Alaud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSUbiquitousContainers:
          iCloud.com.gaoyiming.alaud:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Alaud
            NSUbiquitousContainerSupportedFolderLevels: Any
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: 用于录制你主动开始的会议，并保存原音供会后核对。
        NSSpeechRecognitionUsageDescription: 将已保存的会议录音转成可检索的文字。
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.gaoyiming.alaud.cloudsync]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoyiming.alaud
        CODE_SIGN_ENTITLEMENTS: Config/Phone.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - package: AlaudCore
      - target: AlaudWatch
        embed: true
    scheme:
      testTargets: [AlaudTests, AlaudUITests]
  AlaudMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
        excludes: [WatchTransfer.swift, RecordingIntents.swift]
      - path: Sources/Phone
        excludes: [AlaudApp.swift, InboxView.swift, Assets.xcassets]
      - Sources/Mac
    info:
      path: Config/Mac-Info.plist
      properties:
        CFBundleDisplayName: Alaud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSUbiquitousContainers:
          iCloud.com.gaoyiming.alaud:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Alaud
            NSUbiquitousContainerSupportedFolderLevels: Any
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: 用于录制你主动开始的会议，保存到自己的 iCloud 录音库。
        NSSpeechRecognitionUsageDescription: 将已保存的会议录音在本机转成可检索的文字。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoyiming.alaud.mac
        PRODUCT_NAME: Alaud
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: AlaudCore
  AlaudWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/Shared
      - Sources/Watch
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Alaud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 用于录制你主动开始的会议，结束后同步到配对 iPhone。
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.gaoyiming.alaud
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoyiming.alaud.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    dependencies:
      - package: AlaudCore
  AlaudTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/App]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoyiming.alaud.tests
    dependencies:
      - target: Alaud
      - package: AlaudCore
  AlaudUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoyiming.alaud.uitests
        TEST_TARGET_NAME: Alaud
    dependencies:
      - target: Alaud
